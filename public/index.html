<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Coleção dos áudios lendários da comunidade brasileira de Left 4 Dead 2. Ouça, baixe e compartilhe."
    />

    <title>L4D2 Áudios</title>

    <link rel="icon" href="%PUBLIC_URL%/l4d2 favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- iOS: permite abrir em tela cheia quando adicionado à tela de início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="L4D2 Áudios" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="L4D2 Áudios" />
    <meta
      property="og:description"
      content="Coleção dos áudios lendários da comunidade brasileira de Left 4 Dead 2."
    />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        background-color: #0a0b0d;
      }
      /* Splash simples até o React montar, evitando o "flash" branco */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0b0d;
      }
      #boot span {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid #26292f;
        border-top-color: #e5322d;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar este site.</noscript>
    <div id="root">
      <div id="boot"><span></span></div>
    </div>
  </body>
</html>
